name = "not_another_luau_lib/thread"
version = "0.1.0"
description = "Runs callbacks on a recycled thread instead of creating a new one per call."
authors = []
repository = "https://github.com/not-another-luau-lib/thread"
license = "MIT"
includes = ["src", "default.project.json", "pesde.toml", "README.md", "LICENSE"]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
# Signal = { name = "not_another_luau_lib/signal", version = "^0.1.0" }
# Promise = { wally = "evaera/promise", version = "^4.0.0" }
